
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raj Shopping Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fc;color:#172b4d}
header{background:#1769d2;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:24px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:8px;font-weight:bold}
.hero{padding:55px 7%;background:linear-gradient(120deg,#1769d2,#64a5ff);color:white}
.hero h1{font-size:38px;margin-bottom:12px}
.hero p{margin-bottom:20px}
button{border:0;border-radius:8px;padding:11px 16px;background:#1769d2;color:white;cursor:pointer;font-weight:bold}
.hero button{background:white;color:#1769d2}
.search{padding:20px 5%;display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{padding:12px;border:1px solid #ccd5e5;border-radius:8px;width:100%;font-size:15px}
.search input{flex:1;min-width:180px}
.categories{display:flex;gap:10px;flex-wrap:wrap;padding:0 5% 20px}
.categories button{background:#e3edff;color:#1769d2}
.categories button.active{background:#1769d2;color:white}
h2{margin:20px 5%}
.products{padding:10px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 15px #00000010}
.card img{width:100%;height:165px;object-fit:cover}
.info{padding:15px}
.info h3{margin-bottom:8px}
.price{color:#1769d2;font-size:20px;font-weight:bold;margin:10px 0}
.info button{width:100%}
section{scroll-margin-top:20px}
#cart{background:white;margin:30px 5%;padding:20px;border-radius:14px}
.cart-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ddd}
.cart-item button{padding:6px 10px}
#total{font-size:23px;color:#1769d2;font-weight:bold;margin:18px 0}
.form{display:grid;gap:12px;max-width:600px;margin:20px auto;padding:20px;background:#f3f6fc;border-radius:12px}
footer{text-align:center;background:#12345c;color:white;padding:25px;margin-top:35px}
.empty{text-align:center;padding:20px;color:#777}
</style>
</head>
<body>

<header>
<div class="logo">🛍️ Raj Shopping Store</div>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart 🛒 <span id="count">0</span></a>
</nav>
</header>

<section class="hero" id="home">
<h1>Welcome to Raj Shopping Store</h1>
<p>आपकी पसंद, आपकी Shopping – एक ही जगह!</p>
<button onclick="document.querySelector('#products').scrollIntoView()">Shop Now →</button>
</section>

<div class="search">
<input id="search" placeholder="🔍 सामान खोजें..." oninput="render()">
</div>

<div class="categories" id="categories"></div>

<h2 id="products">🛒 हमारे Products</h2>
<div class="products" id="productList"></div>

<section id="cart">
<h2 style="margin:0 0 15px">🛍️ Your Shopping Cart</h2>
<div id="cartItems"></div>
<div id="total">Total: ₹0</div>

<h3>ऑर्डर की जानकारी</h3>
<form class="form" id="orderForm">
<input id="name" placeholder="आपका नाम" required>
<input id="phone" type="tel" pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर" required>
<textarea id="address" placeholder="पूरा पता" required></textarea>
<button type="submit">WhatsApp पर Order भेजें</button>
</form>
</section>

<footer>
<h3>Raj Shopping Store</h3>
<p>Created by Raj Kumar Nayak | Class 9th</p>
<p>Thank you for shopping ❤️</p>
</footer>

<script>
const products=[
{id:1,name:"चावल (Rice)",cat:"Grocery",price:60,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500",desc:"अच्छी गुणवत्ता वाले चावल"},
{id:2,name:"गेहूँ (Wheat)",cat:"Grocery",price:35,img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500",desc:"साफ और अच्छा गेहूँ"},
{id:3,name:"ताजे आम",cat:"Fruits",price:80,img:"https://images.unsplash.com/photo-1553279768-865429fa0078?w=500",desc:"स्वादिष्ट ताजे आम"},
{id:4,name:"सेब",cat:"Fruits",price:120,img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500",desc:"ताजे सेब"},
{id:5,name:"टमाटर",cat:"Vegetables",price:30,img:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=500",desc:"ताजे टमाटर"},
{id:6,name:"आलू",cat:"Vegetables",price:25,img:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500",desc:"अच्छे आलू"},
{id:7,name:"लकड़ी की कुर्सी",cat:"Furniture",price:900,img:"https://images.unsplash.com/photo-1503602642458-232111445657?w=500",desc:"मजबूत लकड़ी की कुर्सी"},
{id:8,name:"लकड़ी की टेबल",cat:"Furniture",price:1500,img:"https://images.unsplash.com/photo-1499933374294-4584851497cc?w=500",desc:"सुंदर टेबल"},
{id:9,name:"मिट्टी का दीया",cat:"Decoration",price:20,img:"https://images.unsplash.com/photo-1603006905003-be475563bc59?w=500",desc:"सुंदर मिट्टी का दीया"},
{id:10,name:"फूलों का गमला",cat:"Decoration",price:100,img:"https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=500",desc:"घर के लिए सुंदर गमला"}
];

let cart={};
let category="All";

function categories(){
const cats=["All",...new Set(products.map(p=>p.cat))];
document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="${c===category?'active':''}" onclick="setCategory('${c}')">${c}</button>`
).join("");
}
function setCategory(c){category=c;categories();render()}

function render(){
let q=document.getElementById("search").value.toLowerCase();
let filtered=products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q));
document.getElementById("productList").innerHTML=filtered.map(p=>`
<div class="card">
<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/500x300?text=Product'">
<div class="info">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">₹${p.price}</div>
<button onclick="add(${p.id})">Add to Cart +</button>
</div></div>`).join("")||'<p class="empty">कोई सामान नहीं मिला।</p>';
}

function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function change(id,n){cart[id]+=n;if(cart[id]<=0)delete cart[id];updateCart()}
function updateCart(){
let items=Object.entries(cart);
let total=0,count=0;
document.getElementById("cartItems").innerHTML=items.map(([id,qty])=>{
let p=products.find(x=>x.id==id);
total+=p.price*qty;count+=qty;
return `<div class="cart-item">
<div><b>${p.name}</b><br>₹${p.price} × ${qty}</div>
<div><button onclick="change(${id},-1)">−</button>
<button onclick="change(${id},1)">+</button></div>
</div>`;
}).join("")||'<p class="empty">आपकी Cart खाली है।</p>';
document.getElementById("total").innerText="Total: ₹"+total;
document.getElementById("count").innerText=count;
}

document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();
let items=Object.entries(cart);
if(!items.length){alert("पहले Cart में सामान जोड़ें!");return;}
let total=items.reduce((sum,[id,qty])=>sum+products.find(p=>p.id==id).price*qty,0);
let message="New Order - Raj Shopping Store\n";
message+="Name: "+document.getElementById("name").value+"\n";
message+="Mobile: "+document.getElementById("phone").value+"\n";
message+="Address: "+document.getElementById("address").value+"\n\n";
items.forEach(([id,qty])=>{
let p=products.find(x=>x.id==id);
message+=p.name+" x "+qty+" = Rs."+(p.price*qty)+"\n";
});
message+="\nTotal: Rs."+total;
// अपना WhatsApp नंबर country code सहित डालें
let whatsappNumber="91XXXXXXXXXX";
if(whatsappNumber==="91XXXXXXXXXX"){
alert("कोड में अपना WhatsApp नंबर डालें।");
return;
}
window.open("https://wa.me/"+whatsappNumber+"?text="+encodeURIComponent(message),"_blank");
});

categories();
render();
updateCart();
</script>
</body>
</html>
